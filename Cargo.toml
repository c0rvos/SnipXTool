[package]
name = "snipxtool"
version = "0.1.0"
edition = "2021"
description = "Screenshot + screen recorder + editor in one window"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = "0.29"                 # window + UI (egui)
xcap = "0.0.14"                 # screen capture
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"                # text rendering for annotations
cpal = "0.15"                   # audio capture (mic / system loopback)
hound = "3.5"                   # WAV writer
arboard = "3"                   # clipboard (images)
rfd = "0.15"                    # native file dialogs
dirs = "5"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"   # lets us hide the recording bar from the video
tray-icon = "0.26"          # system tray icon + menu (background mode)

# keeps image processing fast even in debug builds
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
